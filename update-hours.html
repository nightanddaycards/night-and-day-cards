<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08080d">
  <meta name="robots" content="noindex, nofollow">
  <title>Update Hours | Night &amp; Day Cards</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Show clean addresses (/update-hours instead of /update-hours.html)
    if (/\.html$/.test(location.pathname) && history.replaceState) {
      history.replaceState(null, "", location.pathname.replace(/(index)?\.html$/, "") + location.search + location.hash);
    }
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/></svg>
      <span>night &amp; day cards</span>
    </a>
  </header>

  <main id="main" class="cart-page admin-hours">
    <h1>Update store hours</h1>
    <p id="hours-status" class="updated">Loading the current hours…</p>

    <form id="hours-form" novalidate>
      <fieldset class="hours-edit">
        <legend class="visually-hidden">Hours for each day</legend>
        <div id="day-rows"></div>
      </fieldset>

      <label class="field">
        <span>Note under the hours <small>(optional, e.g. "Closed Thanksgiving Day")</small></span>
        <input id="hours-note-input" maxlength="200">
      </label>

      <label class="field">
        <span>Password</span>
        <input id="admin-password" type="password" autocomplete="current-password" required>
      </label>

      <p id="hours-msg" class="form-error" role="alert" hidden></p>

      <div class="admin-actions">
        <button id="save-btn" class="btn btn-gold" type="submit">Save hours</button>
        <button id="reset-btn" class="btn btn-dark" type="button">Go back to regular hours</button>
      </div>
      <p class="secure-note">Changes show on the website right away. "Regular hours" are the ones in js/shop.js.</p>
    </form>
  </main>

  <script src="js/shop.js"></script>
  <script src="js/update-hours.js"></script>
</body>
</html>
