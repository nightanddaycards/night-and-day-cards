name: Deploy site

# Publishes the site to GitHub Pages, with a fresh product list from Square.
# Requires: repo Settings > Pages > Source = "GitHub Actions".
#
# Build and deploy are separate jobs (as in GitHub's Pages template): running
# deploy-pages in the same job right after the upload sometimes fails with
# "No artifacts named github-pages were found" because the artifact isn't
# registered yet.

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *" # hourly, to refresh stock
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fetch products from Square
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          REQUIRE_SQUARE: "true" # fail instead of publishing without products
        run: node scripts/fetch-square.mjs
      # Browsers keep scripts and styles for up to 10 minutes. Tagging their addresses
      # with the commit ID (js/main.js?v=abc1234) makes browsers fetch the new copies
      # right after a code change, so a new page never runs with an old script.
      # Only the published copy is changed; the files in the repo stay as they are.
      - name: Add version tags to script and style links
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s#((src|href)=\"(js|css)/[^\"?]+\.(js|css))\"#\1?v=${v}\"#g" *.html
          grep -h -o -E '(src|href)="(js|css)/[^"]+"' *.html | sort -u
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
