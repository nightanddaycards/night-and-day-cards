name: Update hours from Google

on:
  schedule:
    - cron: "17 9 * * *" # daily, ~4-5 am US Eastern
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch hours
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
        run: node scripts/fetch-hours.mjs
      - name: Commit if changed
        run: |
          # Ignore the timestamp so we only commit when the hours themselves change
          if git diff --quiet -I '"updated"' -- data/hours.json && git ls-files --error-unmatch data/hours.json >/dev/null 2>&1; then
            echo "Hours unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/hours.json
          git commit -m "Update hours from Google Business Profile"
          git push
